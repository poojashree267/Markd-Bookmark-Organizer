<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Markd — Bookmark Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --border: #E2DDD5;
    --border2: #CCC8BF;
    --text: #1A1814;
    --text2: #6B6760;
    --text3: #9E9B96;
    --accent: #2D5016;
    --accent-bg: #EBF2E3;
    --accent2: #8B4513;
    --accent2-bg: #F5EBE3;
    --danger: #C0392B;
    --danger-bg: #FDECEA;
    --tag-colors: #2D5016,#1A3A5C,#6B2D6B,#8B4513,#1A5C4A,#5C3A1A;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
    --shadow-lg: 0 4px 20px rgba(0,0,0,.10);
    --radius: 10px;
    --radius-lg: 16px;
    font-size: 15px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 240px;
    min-height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
  }
  .logo {
    padding: 1.5rem 1.25rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .logo h1 {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -.3px;
    color: var(--text);
  }
  .logo span { color: var(--accent); }
  .logo p { font-size: 11px; color: var(--text3); margin-top: 2px; letter-spacing: .3px; text-transform: uppercase; }
  .sidebar-section { padding: .75rem 1rem .25rem; font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); font-weight: 600; }
  .sidebar-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 1.25rem;
    cursor: pointer;
    font-size: 14px;
    color: var(--text2);
    border-radius: 0;
    transition: background .12s, color .12s;
    position: relative;
  }
  .sidebar-item:hover { background: var(--surface2); color: var(--text); }
  .sidebar-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .sidebar-item.active::before {
    content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px;
    background: var(--accent); border-radius: 0 3px 3px 0;
  }
  .sidebar-item .badge {
    margin-left: auto; font-size: 11px; background: var(--surface2);
    color: var(--text3); padding: 1px 7px; border-radius: 99px; font-weight: 400;
  }
  .sidebar-item.active .badge { background: var(--accent); color: #fff; }
  .sidebar-icon { font-size: 15px; width: 18px; text-align: center; }
  .sidebar-footer {
    margin-top: auto; padding: 1rem 1.25rem;
    border-top: 1px solid var(--border);
    display: flex; gap: 8px;
  }
  .sidebar-footer button {
    flex: 1; padding: 7px 0; font-size: 12px; border: 1px solid var(--border2);
    background: none; color: var(--text2); border-radius: var(--radius); cursor: pointer;
    font-family: 'DM Sans', sans-serif; transition: all .12s;
  }
  .sidebar-footer button:hover { background: var(--surface2); color: var(--text); }
  .tag-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* Main */
  .main { margin-left: 240px; flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: rgba(247,245,240,.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: .875rem 2rem;
    display: flex; align-items: center; gap: 12px;
  }
  .search-wrap { position: relative; flex: 1; max-width: 420px; }
  .search-wrap input {
    width: 100%; padding: 9px 14px 9px 36px;
    border: 1px solid var(--border2); border-radius: 99px;
    background: var(--surface); font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text); outline: none;
    transition: border .15s, box-shadow .15s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,80,22,.1); }
  .search-wrap .search-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; font-size: 14px; }
  .view-toggle { display: flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .view-toggle button { padding: 7px 11px; background: none; border: none; cursor: pointer; color: var(--text3); font-size: 14px; transition: all .12s; }
  .view-toggle button.active { background: var(--surface); color: var(--text); }
  .btn-add {
    display: flex; align-items: center; gap: 6px; padding: 9px 18px;
    background: var(--accent); color: #fff; border: none; border-radius: 99px;
    font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; transition: background .15s, transform .1s;
  }
  .btn-add:hover { background: #234012; }
  .btn-add:active { transform: scale(.97); }

  /* Content */
  .content { padding: 2rem; flex: 1; }
  .page-header { margin-bottom: 1.5rem; }
  .page-header h2 { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; }
  .page-header p { font-size: 13px; color: var(--text3); margin-top: 3px; }
  .tag-filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-pill {
    font-size: 12px; padding: 5px 12px; border-radius: 99px;
    border: 1px solid var(--border2); cursor: pointer;
    color: var(--text2); background: var(--surface);
    transition: all .12s; white-space: nowrap;
  }
  .filter-pill:hover { border-color: var(--accent); color: var(--accent); }
  .filter-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Grid / List */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .list { display: flex; flex-direction: column; gap: 8px; }

  /* Bookmark Card */
  .bm-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1.1rem 1.25rem;
    cursor: default; transition: box-shadow .15s, border-color .15s, transform .15s;
    position: relative; display: flex; flex-direction: column; gap: 8px;
  }
  .bm-card:hover { box-shadow: var(--shadow-lg); border-color: var(--border2); transform: translateY(-1px); }
  .bm-card.list-mode { flex-direction: row; align-items: center; gap: 12px; padding: .75rem 1.1rem; }
  .bm-card-favicon { width: 20px; height: 20px; border-radius: 4px; flex-shrink: 0; }
  .bm-card-body { flex: 1; min-width: 0; }
  .bm-card-title { font-weight: 500; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bm-card-url { font-size: 12px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .bm-card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; margin-top: 2px; }
  .bm-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .bm-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-bg); color: var(--accent); cursor: pointer;
    transition: opacity .12s;
  }
  .bm-tag:hover { opacity: .7; }
  .bm-card-actions {
    display: flex; gap: 4px; opacity: 0; transition: opacity .15s;
    flex-shrink: 0;
  }
  .bm-card:hover .bm-card-actions { opacity: 1; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: none;
    background: none; cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 14px; color: var(--text3);
    transition: background .12s, color .12s;
  }
  .icon-btn:hover { background: var(--surface2); color: var(--text); }
  .icon-btn.danger:hover { background: var(--danger-bg); color: var(--danger); }
  .bm-card .pin-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 11px; color: var(--accent2); background: var(--accent2-bg);
    padding: 2px 7px; border-radius: 99px;
  }
  .bm-card.pinned { border-color: rgba(139,69,19,.25); }
  .drag-handle { cursor: grab; color: var(--text3); font-size: 14px; padding: 0 4px; }
  .drag-handle:active { cursor: grabbing; }
  .bm-card.dragging { opacity: .4; }
  .bm-card.drag-over { border: 2px dashed var(--accent); }
  .collection-badge {
    font-size: 11px; color: var(--text3);
    display: inline-flex; align-items: center; gap: 4px;
  }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 5rem 2rem; color: var(--text3);
  }
  .empty-state .empty-ico { font-size: 40px; margin-bottom: .75rem; }
  .empty-state p { font-size: 14px; }
  .empty-state strong { color: var(--text2); }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.35);
    backdrop-filter: blur(4px); z-index: 200;
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface); border-radius: var(--radius-lg);
    padding: 1.75rem; width: 480px; max-width: calc(100vw - 2rem);
    box-shadow: var(--shadow-lg);
    animation: slideUp .18s ease;
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .modal h3 { font-family: 'Instrument Serif', serif; font-size: 20px; font-weight: 400; margin-bottom: 1.25rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border2);
    border-radius: var(--radius); font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--text); background: var(--surface);
    outline: none; transition: border .15s, box-shadow .15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,80,22,.1);
  }
  .field textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
  .field select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%236B6760'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 12px center; padding-right: 32px; }
  .tag-input-wrap {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 7px 10px; border: 1px solid var(--border2); border-radius: var(--radius);
    min-height: 40px; cursor: text; transition: border .15s, box-shadow .15s;
  }
  .tag-input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,80,22,.1); }
  .tag-input-wrap input { border: none; outline: none; background: transparent; font-size: 14px; color: var(--text); font-family: 'DM Sans', sans-serif; flex: 1; min-width: 80px; }
  .tag-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 2px 8px; border-radius: 99px;
    background: var(--accent-bg); color: var(--accent);
  }
  .tag-chip button { background: none; border: none; cursor: pointer; color: var(--accent); font-size: 13px; line-height: 1; padding: 0; opacity: .7; }
  .tag-chip button:hover { opacity: 1; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
  .btn { padding: 9px 20px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; transition: all .12s; border: none; }
  .btn-ghost { background: none; border: 1px solid var(--border2); color: var(--text2); }
  .btn-ghost:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #234012; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: #a93226; }

  /* Collection color picker */
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .12s; }
  .color-swatch:hover { transform: scale(1.2); }
  .color-swatch.selected { border-color: var(--text); }

  /* Toast */
  .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--text); color: var(--bg); padding: 10px 16px;
    border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-lg);
    animation: toastIn .2s ease; max-width: 300px;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* Divider */
  .section-divider { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .7px; padding: .5rem 0; display: flex; align-items: center; gap: 10px; }
  .section-divider::after { content:''; flex:1; height:1px; background: var(--border); }

  /* Stats bar */
  .stats-bar { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--text2); }
  .stat strong { font-size: 18px; display: block; color: var(--text); font-weight: 600; }

  /* Responsive */
  @media (max-width: 700px) {
    .sidebar { width: 100%; min-height: auto; position: relative; flex-direction: row; flex-wrap: wrap; }
    .main { margin-left: 0; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <h1>Mark<span>d</span></h1>
    <p>Bookmark Organizer</p>
  </div>
  <div class="sidebar-section">Views</div>
  <div class="sidebar-item active" data-view="all" onclick="setView('all',this)">
    <span class="sidebar-icon">🔖</span> All Bookmarks
    <span class="badge" id="badge-all">0</span>
  </div>
  <div class="sidebar-item" data-view="pinned" onclick="setView('pinned',this)">
    <span class="sidebar-icon">📌</span> Pinned
    <span class="badge" id="badge-pinned">0</span>
  </div>
  <div class="sidebar-section">Collections</div>
  <div id="collection-list"></div>
  <div class="sidebar-item" style="color:var(--text3); font-size:13px" onclick="openCollectionModal()">
    <span class="sidebar-icon">＋</span> New Collection
  </div>
  <div class="sidebar-section">Tags</div>
  <div id="tag-sidebar-list"></div>
  <div class="sidebar-footer">
    <button onclick="exportJSON()">⬇ Export</button>
    <button onclick="document.getElementById('importFile').click()">⬆ Import</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input type="text" id="searchInput" placeholder="Search bookmarks…" oninput="renderList()" />
    </div>
    <div class="view-toggle">
      <button id="gridBtn" class="active" onclick="setDisplayMode('grid')" title="Grid view">⊞</button>
      <button id="listBtn" onclick="setDisplayMode('list')" title="List view">☰</button>
    </div>
    <button class="btn-add" onclick="openAddModal()">＋ Add Bookmark</button>
  </div>

  <div class="content">
    <div class="page-header">
      <h2 id="pageTitle">All Bookmarks</h2>
      <p id="pageSubtitle"></p>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="tag-filter-row" id="tagFilterRow"></div>
    <div id="bookmarkGrid"></div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div id="bmModal" class="modal-overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h3 id="modalTitle">New Bookmark</h3>
    <div class="field">
      <label>URL *</label>
      <input type="url" id="bmUrl" placeholder="https://example.com" oninput="handleUrlInput()" />
    </div>
    <div class="field">
      <label>Title *</label>
      <input type="text" id="bmTitle" placeholder="Page title" />
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="bmDesc" placeholder="Optional note about this bookmark…"></textarea>
    </div>
    <div class="field">
      <label>Tags <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text3)">(press Enter or comma)</span></label>
      <div class="tag-input-wrap" onclick="document.getElementById('tagTyper').focus()">
        <div id="tagChips"></div>
        <input type="text" id="tagTyper" placeholder="e.g. design, tools…" onkeydown="handleTagKey(event)" />
      </div>
    </div>
    <div class="field">
      <label>Collection</label>
      <select id="bmCollection">
        <option value="">— None —</option>
      </select>
    </div>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:1rem">
      <input type="checkbox" id="bmPinned" style="width:auto; accent-color:var(--accent)" />
      <label for="bmPinned" style="font-size:13px; text-transform:none; letter-spacing:0; font-weight:400; color:var(--text2)">Pin this bookmark</label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('bmModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveBookmark()">Save Bookmark</button>
    </div>
  </div>
</div>

<!-- Collection Modal -->
<div id="colModal" class="modal-overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h3 id="colModalTitle">New Collection</h3>
    <div class="field">
      <label>Name *</label>
      <input type="text" id="colName" placeholder="e.g. Work Resources" />
    </div>
    <div class="field">
      <label>Color</label>
      <div class="color-row" id="colorPicker"></div>
    </div>
    <div class="field">
      <label>Icon</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;" id="iconPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('colModal')">Cancel</button>
      <button id="colDeleteBtn" class="btn btn-danger" style="display:none; margin-right:auto" onclick="deleteCollection()">Delete</button>
      <button class="btn btn-primary" onclick="saveCollection()">Save</button>
    </div>
  </div>
</div>

<!-- Delete Confirm Modal -->
<div id="delModal" class="modal-overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal" style="max-width:380px">
    <h3>Delete Bookmark?</h3>
    <p style="color:var(--text2); font-size:14px; margin:.75rem 0 1.25rem">This will permanently remove <strong id="delTitle"></strong>.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('delModal')">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ===== DATA ===== */
let bookmarks = JSON.parse(localStorage.getItem('markd_bookmarks') || 'null') || [
  { id: 1, url: 'https://github.com', title: 'GitHub', desc: 'Where the world builds software', tags: ['dev','tools'], collection: 'c1', pinned: false, created: Date.now()-864e5*5 },
  { id: 2, url: 'https://figma.com', title: 'Figma', desc: 'Collaborative design tool', tags: ['design','tools'], collection: 'c2', pinned: true, created: Date.now()-864e5*4 },
  { id: 3, url: 'https://news.ycombinator.com', title: 'Hacker News', desc: 'Tech news and discussions', tags: ['news','tech'], collection: '', pinned: false, created: Date.now()-864e5*3 },
  { id: 4, url: 'https://developer.mozilla.org', title: 'MDN Web Docs', desc: 'Web technology documentation', tags: ['dev','reference'], collection: 'c1', pinned: false, created: Date.now()-864e5*2 },
  { id: 5, url: 'https://css-tricks.com', title: 'CSS-Tricks', desc: 'Tips, tricks, and techniques on CSS', tags: ['design','dev','reference'], collection: 'c2', pinned: false, created: Date.now()-864e5 },
];
let collections = JSON.parse(localStorage.getItem('markd_collections') || 'null') || [
  { id: 'c1', name: 'Dev Resources', color: '#2D5016', icon: '💻' },
  { id: 'c2', name: 'Design', color: '#1A3A5C', icon: '🎨' },
];

function save() {
  localStorage.setItem('markd_bookmarks', JSON.stringify(bookmarks));
  localStorage.setItem('markd_collections', JSON.stringify(collections));
}

/* ===== STATE ===== */
let currentView = 'all';
let activeTagFilter = null;
let displayMode = 'grid';
let editingId = null;
let editingColId = null;
let deletingId = null;
let modalTags = [];
let selectedColor = '#2D5016';
let selectedIcon = '📁';
const COLORS = ['#2D5016','#1A3A5C','#6B2D6B','#8B4513','#1A5C4A','#5C3A1A','#8B1A1A','#1A5C5C'];
const ICONS = ['📁','💻','🎨','📚','🎵','🎮','🛒','🌍','🏋️','🍕','🧪','✈️','💼','❤️','⭐','🔬'];

/* ===== RENDER SIDEBAR ===== */
function renderSidebar() {
  const all = bookmarks.length;
  const pinned = bookmarks.filter(b=>b.pinned).length;
  document.getElementById('badge-all').textContent = all;
  document.getElementById('badge-pinned').textContent = pinned;

  // Collections
  const colList = document.getElementById('collection-list');
  colList.innerHTML = collections.map(c => {
    const count = bookmarks.filter(b=>b.collection===c.id).length;
    const active = currentView === 'col-'+c.id ? ' active' : '';
    return `<div class="sidebar-item${active}" onclick="setView('col-${c.id}',this)">
      <span class="sidebar-icon">${c.icon}</span> ${c.name}
      <span class="badge">${count}</span>
    </div>`;
  }).join('');

  // Tag sidebar
  const tags = getAllTags();
  const tagList = document.getElementById('tag-sidebar-list');
  tagList.innerHTML = tags.slice(0,12).map(t => {
    const active = activeTagFilter===t ? ' active' : '';
    return `<div class="sidebar-item${active}" onclick="setTagFilter('${t}')">
      <span class="sidebar-icon" style="font-size:9px">●</span> ${t}
      <span class="badge">${bookmarks.filter(b=>b.tags.includes(t)).length}</span>
    </div>`;
  }).join('');
}

/* ===== RENDER MAIN ===== */
function getAllTags() {
  const s = new Set();
  bookmarks.forEach(b => b.tags.forEach(t => s.add(t)));
  return [...s].sort();
}

function getFilteredBookmarks() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = [...bookmarks];

  if (currentView === 'pinned') list = list.filter(b=>b.pinned);
  else if (currentView.startsWith('col-')) {
    const cid = currentView.slice(4);
    list = list.filter(b=>b.collection===cid);
  }

  if (activeTagFilter) list = list.filter(b=>b.tags.includes(activeTagFilter));
  if (q) list = list.filter(b =>
    b.title.toLowerCase().includes(q) ||
    b.url.toLowerCase().includes(q) ||
    (b.desc||'').toLowerCase().includes(q) ||
    b.tags.some(t=>t.includes(q))
  );

  // pinned first
  list.sort((a,b) => (b.pinned?1:0) - (a.pinned?1:0));
  return list;
}

function renderList() {
  renderSidebar();
  const list = getFilteredBookmarks();

  // Page header
  let title = 'All Bookmarks';
  if (currentView === 'pinned') title = 'Pinned';
  else if (currentView.startsWith('col-')) {
    const col = collections.find(c=>c.id===currentView.slice(4));
    title = col ? col.icon+' '+col.name : 'Collection';
  }
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSubtitle').textContent = list.length + ' bookmark' + (list.length!==1?'s':'') + (activeTagFilter?` tagged "${activeTagFilter}"`:'');

  // Stats
  const tags = getAllTags();
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><strong>${bookmarks.length}</strong>Total</div>
    <div class="stat"><strong>${bookmarks.filter(b=>b.pinned).length}</strong>Pinned</div>
    <div class="stat"><strong>${collections.length}</strong>Collections</div>
    <div class="stat"><strong>${tags.length}</strong>Tags</div>
  `;

  // Tag filter pills
  const tfr = document.getElementById('tagFilterRow');
  if (tags.length) {
    tfr.innerHTML = tags.map(t =>
      `<span class="filter-pill${activeTagFilter===t?' active':''}" onclick="setTagFilter('${t}')">${t}</span>`
    ).join('');
  } else tfr.innerHTML = '';

  // Cards
  const grid = document.getElementById('bookmarkGrid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-ico">🔍</div>
      <p><strong>No bookmarks found</strong><br>Try a different search or add a new one.</p>
    </div>`;
    return;
  }

  grid.className = displayMode === 'grid' ? 'grid' : 'list';

  // Pinned section
  const pinnedItems = list.filter(b=>b.pinned);
  const normalItems = list.filter(b=>!b.pinned);
  let html = '';
  if (pinnedItems.length && currentView!=='pinned') {
    html += `<div class="section-divider" style="grid-column:1/-1">Pinned</div>`;
    html += pinnedItems.map(b=>cardHTML(b)).join('');
    if (normalItems.length) html += `<div class="section-divider" style="grid-column:1/-1">All</div>`;
  }
  html += normalItems.map(b=>cardHTML(b)).join('');
  grid.innerHTML = html;

  // Init drag
  initDrag();

  // Update collection select
  const sel = document.getElementById('bmCollection');
  const cur = sel.value;
  sel.innerHTML = '<option value="">— None —</option>' + collections.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  sel.value = cur;
}

function cardHTML(b) {
  const col = collections.find(c=>c.id===b.collection);
  const favicon = getFavicon(b.url);
  const lm = displayMode==='list';
  return `<div class="bm-card${lm?' list-mode':''}${b.pinned?' pinned':''}" 
    draggable="true" data-id="${b.id}"
    ondragstart="dragStart(event,${b.id})"
    ondragover="dragOver(event)"
    ondrop="dropOn(event,${b.id})"
    ondragleave="dragLeave(event)">
    ${b.pinned && !lm ? '<span class="pin-badge">📌 Pinned</span>' : ''}
    <img class="bm-card-favicon" src="${favicon}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><rect width=%2216%22 height=%2216%22 rx=%222%22 fill=%22%23e2ddd5%22/></svg>'" />
    <div class="bm-card-body">
      <div class="bm-card-title">${escHtml(b.title)}</div>
      <div class="bm-card-url">${escHtml(b.url)}</div>
      ${!lm && b.desc ? `<div class="bm-card-desc">${escHtml(b.desc)}</div>` : ''}
      <div class="bm-tags" style="margin-top:6px">
        ${b.tags.map(t=>`<span class="bm-tag" onclick="setTagFilter('${t}')">${t}</span>`).join('')}
        ${col ? `<span class="collection-badge"><span style="background:${col.color};border-radius:50%;width:7px;height:7px;display:inline-block"></span>${col.name}</span>` : ''}
      </div>
    </div>
    <div class="bm-card-actions">
      <a href="${escHtml(b.url)}" target="_blank" rel="noopener" style="text-decoration:none">
        <button class="icon-btn" title="Open link">↗</button>
      </a>
      <button class="icon-btn" title="${b.pinned?'Unpin':'Pin'}" onclick="togglePin(${b.id})">📌</button>
      <button class="icon-btn" title="Edit" onclick="openEditModal(${b.id})">✏️</button>
      <button class="icon-btn danger" title="Delete" onclick="openDeleteModal(${b.id})">🗑</button>
    </div>
  </div>`;
}

function getFavicon(url) {
  try { return 'https://www.google.com/s2/favicons?sz=32&domain='+new URL(url).hostname; }
  catch(e) { return ''; }
}
function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ===== DRAG & DROP ===== */
let dragId = null;
function initDrag() {}
function dragStart(e, id) { dragId = id; e.currentTarget.classList.add('dragging'); }
function dragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function dropOn(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if (dragId === targetId) return;
  const from = bookmarks.findIndex(b=>b.id===dragId);
  const to = bookmarks.findIndex(b=>b.id===targetId);
  const [item] = bookmarks.splice(from, 1);
  bookmarks.splice(to, 0, item);
  save(); renderList();
}
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.bm-card').forEach(c=>c.classList.remove('dragging','drag-over')); });

/* ===== VIEW CONTROLS ===== */
function setView(view, el) {
  currentView = view;
  activeTagFilter = null;
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  if (el) el.classList.add('active');
  renderList();
}
function setTagFilter(tag) {
  activeTagFilter = activeTagFilter===tag ? null : tag;
  renderList();
}
function setDisplayMode(mode) {
  displayMode = mode;
  document.getElementById('gridBtn').classList.toggle('active', mode==='grid');
  document.getElementById('listBtn').classList.toggle('active', mode==='list');
  renderList();
}

/* ===== ADD / EDIT BOOKMARK ===== */
function openAddModal() {
  editingId = null;
  modalTags = [];
  document.getElementById('modalTitle').textContent = 'New Bookmark';
  document.getElementById('bmUrl').value = '';
  document.getElementById('bmTitle').value = '';
  document.getElementById('bmDesc').value = '';
  document.getElementById('bmPinned').checked = false;
  document.getElementById('bmCollection').value = '';
  renderModalTags();
  // Populate collection select
  const sel = document.getElementById('bmCollection');
  sel.innerHTML = '<option value="">— None —</option>' + collections.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  document.getElementById('bmModal').style.display = 'flex';
  setTimeout(()=>document.getElementById('bmUrl').focus(), 50);
}

function openEditModal(id) {
  const b = bookmarks.find(b=>b.id===id);
  editingId = id;
  modalTags = [...b.tags];
  document.getElementById('modalTitle').textContent = 'Edit Bookmark';
  document.getElementById('bmUrl').value = b.url;
  document.getElementById('bmTitle').value = b.title;
  document.getElementById('bmDesc').value = b.desc||'';
  document.getElementById('bmPinned').checked = b.pinned||false;
  const sel = document.getElementById('bmCollection');
  sel.innerHTML = '<option value="">— None —</option>' + collections.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
  sel.value = b.collection||'';
  renderModalTags();
  document.getElementById('bmModal').style.display = 'flex';
}

function handleUrlInput() {
  const url = document.getElementById('bmUrl').value;
  const titleEl = document.getElementById('bmTitle');
  if (!titleEl.value && !editingId) {
    try { titleEl.placeholder = new URL(url).hostname.replace('www.',''); } catch(e) {}
  }
}

function handleTagKey(e) {
  if (e.key==='Enter'||e.key===',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/,'').toLowerCase();
    if (val && !modalTags.includes(val)) { modalTags.push(val); renderModalTags(); }
    e.target.value = '';
  }
  if (e.key==='Backspace' && !e.target.value && modalTags.length) {
    modalTags.pop(); renderModalTags();
  }
}
function removeModalTag(t) { modalTags=modalTags.filter(x=>x!==t); renderModalTags(); }
function renderModalTags() {
  document.getElementById('tagChips').innerHTML = modalTags.map(t=>
    `<span class="tag-chip">${t}<button onclick="removeModalTag('${t}')">×</button></span>`
  ).join('');
}

function saveBookmark() {
  const url = document.getElementById('bmUrl').value.trim();
  let title = document.getElementById('bmTitle').value.trim();
  if (!url) { toast('Please enter a URL', true); return; }
  if (!title) { try { title = new URL(url).hostname.replace('www.',''); } catch(e) { title = url; } }
  // flush pending tag
  const pending = document.getElementById('tagTyper').value.trim().replace(/,$/,'').toLowerCase();
  if (pending && !modalTags.includes(pending)) modalTags.push(pending);
  document.getElementById('tagTyper').value = '';

  if (editingId) {
    const b = bookmarks.find(b=>b.id===editingId);
    Object.assign(b, { url, title, desc: document.getElementById('bmDesc').value.trim(), tags: [...modalTags], pinned: document.getElementById('bmPinned').checked, collection: document.getElementById('bmCollection').value });
    toast('Bookmark updated');
  } else {
    bookmarks.unshift({ id: Date.now(), url, title, desc: document.getElementById('bmDesc').value.trim(), tags: [...modalTags], pinned: document.getElementById('bmPinned').checked, collection: document.getElementById('bmCollection').value, created: Date.now() });
    toast('Bookmark saved');
  }
  save(); closeModal('bmModal'); renderList();
}

/* ===== DELETE ===== */
function openDeleteModal(id) {
  deletingId = id;
  const b = bookmarks.find(b=>b.id===id);
  document.getElementById('delTitle').textContent = '"'+b.title+'"';
  document.getElementById('delModal').style.display = 'flex';
}
function confirmDelete() {
  bookmarks = bookmarks.filter(b=>b.id!==deletingId);
  save(); closeModal('delModal'); renderList();
  toast('Bookmark deleted');
}

/* ===== PIN ===== */
function togglePin(id) {
  const b = bookmarks.find(b=>b.id===id);
  b.pinned = !b.pinned;
  save(); renderList();
  toast(b.pinned ? 'Pinned' : 'Unpinned');
}

/* ===== COLLECTIONS ===== */
function openCollectionModal(id) {
  editingColId = id || null;
  selectedColor = '#2D5016'; selectedIcon = '📁';
  if (id) {
    const c = collections.find(c=>c.id===id);
    document.getElementById('colModalTitle').textContent = 'Edit Collection';
    document.getElementById('colName').value = c.name;
    selectedColor = c.color; selectedIcon = c.icon;
    document.getElementById('colDeleteBtn').style.display = 'block';
  } else {
    document.getElementById('colModalTitle').textContent = 'New Collection';
    document.getElementById('colName').value = '';
    document.getElementById('colDeleteBtn').style.display = 'none';
  }
  // Color picker
  document.getElementById('colorPicker').innerHTML = COLORS.map(c=>
    `<div class="color-swatch${selectedColor===c?' selected':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`
  ).join('');
  // Icon picker
  document.getElementById('iconPicker').innerHTML = ICONS.map(ic=>
    `<span style="font-size:20px;cursor:pointer;padding:3px;border-radius:6px;border:2px solid ${selectedIcon===ic?'var(--text)':'transparent'}" onclick="pickIcon('${ic}')">${ic}</span>`
  ).join('');
  document.getElementById('colModal').style.display = 'flex';
}

function pickColor(c) {
  selectedColor = c;
  document.querySelectorAll('.color-swatch').forEach(el => el.classList.toggle('selected', el.style.background===c||el.style.background.includes(c)));
}
function pickIcon(ic) {
  selectedIcon = ic;
  document.querySelectorAll('#iconPicker span').forEach(el => { el.style.borderColor = el.textContent===ic?'var(--text)':'transparent'; });
}

function saveCollection() {
  const name = document.getElementById('colName').value.trim();
  if (!name) { toast('Please enter a name', true); return; }
  if (editingColId) {
    const c = collections.find(c=>c.id===editingColId);
    Object.assign(c, { name, color: selectedColor, icon: selectedIcon });
  } else {
    collections.push({ id: 'c'+Date.now(), name, color: selectedColor, icon: selectedIcon });
  }
  save(); closeModal('colModal'); renderList();
  toast('Collection saved');
}
function deleteCollection() {
  collections = collections.filter(c=>c.id!==editingColId);
  bookmarks.forEach(b => { if(b.collection===editingColId) b.collection=''; });
  save(); closeModal('colModal');
  if (currentView==='col-'+editingColId) setView('all', document.querySelector('[data-view="all"]'));
  renderList(); toast('Collection deleted');
}

/* ===== IMPORT / EXPORT ===== */
function exportJSON() {
  const data = JSON.stringify({ bookmarks, collections }, null, 2);
  const a = document.createElement('a');
  a.href = 'data:application/json,' + encodeURIComponent(data);
  a.download = 'markd-bookmarks-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Exported successfully');
}
function importJSON(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.bookmarks) bookmarks = data.bookmarks;
      if (data.collections) collections = data.collections;
      save(); renderList();
      toast('Imported '+bookmarks.length+' bookmarks');
    } catch(err) { toast('Invalid file', true); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* ===== MODAL HELPERS ===== */
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function handleOverlayClick(e) { if (e.target.classList.contains('modal-overlay')) closeModal(e.target.id); }
document.addEventListener('keydown', e => { if (e.key==='Escape') document.querySelectorAll('.modal-overlay').forEach(m=>m.style.display='none'); });

/* ===== TOAST ===== */
function toast(msg, isError=false) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = isError ? 'var(--danger)' : 'var(--text)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

/* ===== INIT ===== */
renderList();
</script>
</body>
</html>
